<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Yos-X</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; color: #000000; background: #ffffff; font-family: Arial, sans-serif; }
      body { min-height: 100svh; padding: 1rem; display: grid; grid-template-rows: auto 1fr auto; }
      .mark { display: block; width: 2.5rem; height: 2.5rem; background: #000000; }
      main { display: grid; place-content: center; }
      strong { font-size: clamp(8rem, 35vw, 32rem); font-weight: 400; line-height: 0.7; }
      a { width: max-content; padding: 0.75rem 0; color: #000000; border-bottom: 1px solid #000000; text-decoration: none; }
      a:focus-visible { outline: 2px solid #000000; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <span class="mark" aria-hidden="true"></span>
    <main><strong>404</strong></main>
    <a href="/#/">返回 Yos-X</a>
  </body>
</html>
